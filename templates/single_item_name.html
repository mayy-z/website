{% extends 'base.html' %}
{% block content %}

<head>
      <link rel="stylesheet" href="{{url_for ('static', filename='/style.css')}}">
</head>
<body>
      <div class="type">
          <h1>{{item_name[1]}}</h1>
        <div class="item-container"></div>
           <p>Description: {{item_name[2]}}</p>
           <p>Color: {{item_name[3]}}</p>
           <p class>Price: {{item_name[4]}}</p>
           <div class="shopping">
            <form action="/add_to_cart/{{item_name[0]}}" method="POST"> <button type="submit"><li class= "checkout"><a href="/checkout" ><i class="fa-solid fa-basket-shopping"></i></a></li></button>></form>

          <img class= "item-image" src="{{url_for('static',filename='images/'+item_name[5])}}" alt="{{item_name[1]}}">
      </div>
</body>
{% endblock %}
